# Mosquitto MQTT Broker Configuration for Emergency Response System

# Persistence
persistence false

# Logging
log_dest stdout
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Connection settings
max_connections -1
max_keepalive 300

# MQTT Protocol
listener 1883
protocol mqtt
allow_anonymous true

# WebSocket Protocol (for web-based MQTT clients if needed)
listener 9001
protocol websockets
allow_anonymous true

# Message size limits (10MB for large payloads)
max_packet_size 10485760

# Queue settings
max_queued_messages 1000
max_inflight_messages 100

# Connection messages
connection_messages true

# Retained messages
retained_persistence true

# Auto ID assignment
auto_id_prefix emergency_